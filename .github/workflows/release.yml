name: release
on:
  push:
    tags: ["v*"]

# Publishes the `sproutboat` package to npm on a `vX.Y.Z` tag whose number
# matches package.json. Requires an `NPM_TOKEN` repo secret — an npm automation
# token with publish rights on the `sproutboat` package. Provenance needs this
# repo to stay public.
jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'baronunread/sproutboat-cli'
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v4
      - name: tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          test "$tag" = "$pkg" || { echo "tag $tag != package.json $pkg"; exit 1; }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
