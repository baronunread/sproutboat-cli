name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

  runtime-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The toolchain caches: the patched Porffor source, SQLite and BearSSL
      # objects and the host uSockets build (~/.cache/sproutboat,
      # ~/.cache/porffor/deps), and Porffor's per-entry compiled C units
      # (~/.cache/porffor/build). Every entry is checked before it is used:
      # the first three against recorded sha256 digests and the exact compiler
      # command, the units byte for byte against freshly generated C and flags,
      # so a stale entry is rebuilt rather than trusted. Every binary is still
      # compiled and linked from scratch. The key carries the runner image (the
      # system clang that wrote the LTO objects) and the toolchain version.
      - name: Compute the toolchain cache key
        id: cache-key
        shell: bash
        run: |
          toolchain="$(grep -oE '"@sproutboat/toolchain@[^"]+"' bun.lock | head -1 | tr -d '"')"
          test -n "$toolchain"
          echo "prefix=toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${ImageOS}-${ImageVersion}-${toolchain}-" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/sproutboat
            !~/.cache/sproutboat/zig-*
            ~/.cache/porffor
          key: ${{ steps.cache-key.outputs.prefix }}${{ hashFiles('bun.lock', 'src/**', 'examples/**') }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}
      # Porffor prunes unit dirs unused for a week. A restored dir keeps its
      # old mtime, so mark it used now rather than have it pruned mid-run.
      - name: Mark restored Porffor unit dirs as used
        shell: bash
        run: if [ -d ~/.cache/porffor/build ]; then find ~/.cache/porffor/build -name flags -exec touch {} +; fi
      - run: bun install --frozen-lockfile
      - run: bun run kitchen-sink
      - run: bun run kitchen-sink:standalone
      - run: bun run examples

  packaged-cli:
    name: packaged CLI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64
            # GitHub's macOS x64 pool is routinely unavailable. Bun can
            # cross-compile this target from the macOS arm64 image.
            runner: macos-14
            dir: darwin-x64
            cross: true
          - name: macOS arm64
            runner: macos-14
            dir: darwin-arm64
          - name: Linux x64
            runner: ubuntu-24.04
            dir: linux-x64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            dir: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-cli.ts --target ${{ matrix.dir }}
      - name: Check the cross-built executable's architecture
        if: matrix.cross
        shell: bash
        run: |
          cli="platform-packages/${{ matrix.dir }}/bin/sproutboat"
          test -x "$cli"
          file "$cli"
          lipo -archs "$cli" | grep -qw x86_64 || { echo "not an x86_64 binary"; exit 1; }
      - name: Exercise the packaged executable with a cold host cache
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          cli="platform-packages/${{ matrix.dir }}/bin/sproutboat"
          test -x "$cli"
          "$cli" --version
          HOME="$RUNNER_TEMP/sproutboat-home" \
          SPROUTBOAT_TOOLCHAIN_CACHE="$RUNNER_TEMP/sproutboat-toolchain" \
          "$cli" build --target host examples/hello
          sprout="$(find examples/hello/.sproutboat/dist -type f -name sprout -print -quit)"
          test -x "$sprout"
          PORT=8791 "$sprout" >"$RUNNER_TEMP/sprout.log" 2>&1 &
          sprout_pid=$!
          trap 'kill "$sprout_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8791/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/sprout.log"
          exit 1
