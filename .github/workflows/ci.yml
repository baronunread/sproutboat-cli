name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

  packaged-cli:
    name: packaged CLI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64
            runner: macos-13
          - name: macOS arm64
            runner: macos-14
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Linux arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build:cli
      - name: Exercise the packaged executable with a cold host cache
        shell: bash
        run: |
          platform="$(node -p '`${process.platform}-${process.arch}`')"
          cli="platform-packages/$platform/bin/sproutboat"
          test -x "$cli"
          "$cli" --version
          HOME="$RUNNER_TEMP/sproutboat-home" \
          SPROUTBOAT_TOOLCHAIN_CACHE="$RUNNER_TEMP/sproutboat-toolchain" \
          "$cli" build --target host examples/hello
          sprout="$(find examples/hello/.sproutboat/dist -type f -name sprout -print -quit)"
          test -x "$sprout"
          PORT=8791 "$sprout" >"$RUNNER_TEMP/sprout.log" 2>&1 &
          sprout_pid=$!
          trap 'kill "$sprout_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8791/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/sprout.log"
          exit 1
