# Regenerates vendor/uwebsockets-<short>-musl.tar.xz — the prebuilt uWebSockets
# tree that `ensureUWebSockets()` extracts so a first `sproutboat build` needs
# no `git` / `make`.
#
# Run after bumping the `porffor` pin (its uWebSockets commit changes). It opens
# a PR with the refreshed archive + the new UWS_TARBALL_SHA256.
name: uws-prebuild
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile

      - name: Rebuild the archive
        run: bun tools/prebuild-uws.ts

      - name: Pin the sha + drop stale archives
        run: |
          SHORT=$(node -e 'process.stdout.write(/UWS_COMMIT\s*=\s*.([0-9a-f]{8})/.exec(require("fs").readFileSync("node_modules/porffor/compiler/uwebsockets.js","utf8"))[1])')
          SHA=$(sha256sum "vendor/uwebsockets-$SHORT-musl.tar.xz" | cut -d' ' -f1)
          find vendor -name 'uwebsockets-*-musl.tar.xz' ! -name "uwebsockets-$SHORT-musl.tar.xz" -delete
          sed -i "s/const UWS_TARBALL_SHA256 = \".*\";/const UWS_TARBALL_SHA256 = \"$SHA\";/" src/toolchain.ts
          echo "SHORT=$SHORT" >> "$GITHUB_ENV"

      - uses: peter-evans/create-pull-request@v6
        with:
          branch: uws-prebuild/${{ env.SHORT }}
          title: "Refresh prebuilt uWebSockets (${{ env.SHORT }})"
          body: "Generated by `.github/workflows/uws-prebuild.yml` after a porffor pin bump."
          commit-message: "vendor: prebuilt uWebSockets ${{ env.SHORT }}"
          add-paths: |
            vendor/
            src/toolchain.ts
