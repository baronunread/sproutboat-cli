version: 2
updates:
  # Keep the workflow actions current (catches e.g. checkout/setup-node major bumps).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Bun deps (one bun.lock). The npm ecosystem can't update bun.lock, so its
  # PRs failed `bun install --frozen-lockfile`. Ignored: @sproutboat/* are our
  # own packages, moved by hand with each tested release (a toolchain bump
  # changes the Porffor compiler).
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@sproutboat/*"
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
